name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on shell scripts
        run: shellcheck battery.sh setup.sh update.sh

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      - name: Run ESLint (Check Only)
        working-directory: ./app
        run: npm run lint:check

      - name: Security & Fork Consistency Audit
        run: |
          echo "Verifying no operational references to upstream repo remain in scripts..."
          ! grep -rn "actuallymentor/battery/main/setup.sh" setup.sh update.sh app/
          ! grep -rn "actuallymentor/battery/archive" setup.sh update.sh app/
          ! grep -rn "unidentifiedanalytics.web.app" app/

  unit-tests:
    name: Unit Tests
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./app
        run: npm test

      - name: CLI Smoke Test (Non-destructive)
        run: |
          chmod +x ./battery.sh
          ./battery.sh version
          ./battery.sh help
          ./battery.sh notify status

  electron-build:
    name: Electron Production Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Electron App
        working-directory: ./app
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
